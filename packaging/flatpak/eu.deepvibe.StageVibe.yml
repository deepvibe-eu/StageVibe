# Flatpak manifest for StageVibe.
#
# Local build:
#   pnpm -F stagevibe make:release        # -> apps/browser/out/release/stagevibe-linux-x64
#   flatpak-builder --force-clean --user --install build-dir \
#     packaging/flatpak/eu.deepvibe.StageVibe.yml
#
# For a Flathub submission, replace the `type: dir` source below with an
# `type: archive` (or `type: git`) source pointing at the released
# `stagevibe-linux-x64-<version>.zip` and add the corresponding sha256.
app-id: eu.deepvibe.StageVibe
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: "25.08"
command: stagevibe-launcher.sh
separate-locales: false
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --share=network
  - --device=dri
  # A coding IDE needs broad file access and the ability to reach host
  # tooling (git/node/shells) via `flatpak-spawn --host`.
  - --filesystem=host
  - --talk-name=org.freedesktop.Flatpak
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
  - --env=ELECTRON_TRASH=gio
  - --env=TMPDIR=/var/tmp
modules:
  - name: stagevibe
    buildsystem: simple
    build-commands:
      - mkdir -p /app/stagevibe
      - cp -a . /app/stagevibe/
      - chmod +x /app/stagevibe/stagevibe
      - install -Dm755 stagevibe-launcher.sh /app/bin/stagevibe-launcher.sh
      - install -Dm644 eu.deepvibe.StageVibe.desktop /app/share/applications/eu.deepvibe.StageVibe.desktop
      - install -Dm644 eu.deepvibe.StageVibe.metainfo.xml /app/share/metainfo/eu.deepvibe.StageVibe.metainfo.xml
      - install -Dm644 eu.deepvibe.StageVibe.png /app/share/icons/hicolor/512x512/apps/eu.deepvibe.StageVibe.png
    sources:
      # Local unpacked app produced by `pnpm -F stagevibe make:release`.
      - type: dir
        path: ../../apps/browser/out/release/stagevibe-linux-x64
      - type: file
        path: stagevibe-launcher.sh
      - type: file
        path: eu.deepvibe.StageVibe.desktop
      - type: file
        path: eu.deepvibe.StageVibe.metainfo.xml
      - type: file
        path: ../../apps/browser/assets/icons/release/icon-512.png
        dest-filename: eu.deepvibe.StageVibe.png
